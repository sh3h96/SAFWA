<div class="w-full space-y-6">

<label class="font-body-md text-body-md text-primary font-semibold">رقم الجوال أو البريد الإلكتروني</label>

</div>
<button class="w-full h-12 bg-primary-container text-white font-semibold rounded-lg hover:bg-teal-hover active:scale-95 transition-all flex items-center justify-center gap-2" onclick="goToStep('step-otp')">

</div>

<script>
        function goToStep(stepId) {
            // Hide all steps
            document.querySelectorAll('[data-step]').forEach(step => {
                step.setAttribute('data-step', '');
                step.classList.remove('active');
            });
            // Show selected step
            const nextStep = document.getElementById(stepId);
            nextStep.setAttribute('data-step', 'active');
            
            // Animation triggers
            nextStep.style.opacity = '0';
            nextStep.style.transform = 'translateY(10px)';
            setTimeout(() => {
                nextStep.style.opacity = '1';
                nextStep.style.transform = 'translateY(0)';
            }, 50);
        }

        // Simple OTP Auto-focus logic
        const inputs = document.querySelectorAll('.otp-input');
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });

        // Toggle Password Visibility
        document.querySelectorAll('[data-icon="visibility"]').forEach(btn => {
            btn.addEventListener('click', function() {
                const input = this.nextElementSibling || this.previousElementSibling;
                if(input.type === "password") {
                    input.type = "text";
                    this.textContent = "visibility_off";
                } else {
                    input.type = "password";
                    this.textContent = "visibility";
                }
            });
        });
    </script>
